# Keep the selected ViewSonic speaker endpoint ready for short SIE/VA cues.
# Other playback outputs and all capture sources retain their existing policy.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.1.hdmi-stereo" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
