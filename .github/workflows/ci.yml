name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_sie_dictation
          POSTGRES_USER: sie_test
          POSTGRES_PASSWORD: sie_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SIE_TEST_DB: host=localhost user=sie_test password=sie_test dbname=test_sie_dictation
    strategy:
      matrix:
        toolchain: [stable, '1.89.0']
    steps:
      - uses: actions/checkout@v4
      - name: Install integration test tools
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon libglib2.0-bin cmake build-essential tmux
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --test correction_database -- --ignored
      - run: cargo build --locked --release
