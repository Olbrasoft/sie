[package]
name = "sie"
default-run = "sie"
version = "0.9.2"
edition = "2024"
rust-version = "1.89"
description = "System Interface Extensions for the Linux desktop"
license = "MIT"
repository = "https://github.com/Olbrasoft/sie"
authors = ["Jiří Tůma", "Olbrasoft"]

[features]
default = []
cuda = ["whisper-rs/cuda"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = { version = "0.13", features = ["tokio"] }
futures-util = "0.3"
hound = "3.5"
ksni = "0.3.7"
nix = { version = "0.29", features = ["signal", "ioctl"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time", "io-util", "io-std", "fs"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whisper-rs = "0.16"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
